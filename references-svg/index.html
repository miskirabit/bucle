<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BUCLE · Comparación PNG / SVG</title>
<style>
:root{color-scheme:dark;--bg:#0d0d0f;--card:#18181d;--line:#2b2b32;--red:#ff234e;--muted:#8d8d97}*{box-sizing:border-box}body{margin:0;padding:32px 18px 60px;background:radial-gradient(circle at 10% 0,#281117,var(--bg) 35%);color:#f5f5f7;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1320px;margin:auto}header{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:24px}h1{font-size:clamp(1.7rem,4vw,2.8rem);letter-spacing:-.04em;margin:0}h1 span{color:var(--red)}p{color:var(--muted);margin:.4rem 0 0}.badge{border:1px solid var(--line);border-radius:999px;padding:8px 12px;color:#bbb;font-size:.72rem}.grid{display:grid;gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}.card-head{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--line)}h2{font-size:.9rem;margin:0}.ok{color:#54db8a;font-size:.68rem}.compare{display:grid;grid-template-columns:1fr 1fr;min-height:320px}.pane{padding:14px;display:grid;grid-template-rows:auto 1fr;gap:10px}.pane+ .pane{border-left:1px solid var(--line)}.label{font-size:.62rem;letter-spacing:.13em;color:#777}.canvas{min-height:280px;display:grid;place-items:center;border-radius:12px;background-color:#08080a;background-image:linear-gradient(45deg,#111 25%,transparent 25%),linear-gradient(-45deg,#111 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#111 75%),linear-gradient(-45deg,transparent 75%,#111 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}.canvas img{display:block;width:100%;height:300px;object-fit:contain}.foot{padding:10px 16px;border-top:1px solid var(--line);font-size:.7rem;color:#777}.foot code{color:#bbb}@media(max-width:720px){header{align-items:start;flex-direction:column}.compare{grid-template-columns:1fr}.pane+.pane{border-left:0;border-top:1px solid var(--line)}.canvas img{height:240px}}
</style>
</head>
<body><div class="wrap">
<header><div><h1><span>BUCLE</span> · PNG → SVG</h1><p>Comparación directa de las referencias originales y sus paths vectoriales editables.</p></div><div class="badge">6 referencias · fondo transparente · sin raster embebido</div></header>
<div class="grid" id="grid"></div>
</div>
<script>
const files=['BOCAS','DIENTE','DIENTES','JUNTOS','LIP','boca y dientes'];
const grid=document.querySelector('#grid');
files.forEach(name=>{
 const encoded=encodeURIComponent(name);
 grid.insertAdjacentHTML('beforeend',`<article class="card"><div class="card-head"><h2>${name}</h2><span class="ok">● VECTOR EDITABLE</span></div><div class="compare"><div class="pane"><span class="label">PNG ORIGINAL</span><div class="canvas"><img src="../${encoded}.png" alt="${name} original"></div></div><div class="pane"><span class="label">SVG VECTORIZADO</span><div class="canvas"><img src="${encoded}.svg" alt="${name} vectorizado"></div></div></div><div class="foot"><code>${name}.svg</code> · paths rojo/blanco · viewBox original</div></article>`)
});
</script></body></html>
